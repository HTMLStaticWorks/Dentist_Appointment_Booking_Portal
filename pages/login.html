<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Patient Login — Aura Dental Studio. Access your appointment schedule, treatment history, and dental records.">
  <title>Patient Login | Aura Dental Studio</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>

  <div class="auth-top-actions">
    <button class="rtl-toggle-btn" aria-label="Toggle RTL Direction"><i class="bi bi-translate"></i></button>
    <button class="theme-toggle-btn" aria-label="Toggle Theme"><i class="bi bi-moon-stars"></i></button>
  </div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="brand-logo" style="justify-content: center; margin-bottom: 1rem; text-decoration: none; color: inherit;">
          <div class="brand-icon"><i class="bi bi-shield-plus"></i></div>
          <span>Aura<span class="text-accent">Dental</span></span>
        </a>
        <h1>Patient Portal Login</h1>
        <p>Access your appointments, dental records, and treatment plans securely.</p>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" value="sarah.jenkins@example.com" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" value="DemoSecure2026!" placeholder="••••••••" required>
        </div>

        <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; color: var(--color-text-body);">
            <input type="checkbox" checked style="width: 16px; height: 16px; accent-color: var(--color-accent);"> Remember me for 30 days
          </label>
          <a href="forgot-password.html" style="font-size: 0.9rem; color: var(--color-accent); font-weight: 600; text-decoration: none;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-bottom: 1rem;">
          <i class="bi bi-box-arrow-in-right"></i> Sign In to Patient Portal
        </button>


      </form>

      <div class="auth-divider" style="display: flex; align-items: center; text-align: center; margin: 1.5rem 0;">
        <hr style="flex-grow: 1; border: none; border-top: 1px solid var(--color-border); margin-right: 1rem;">
        <span style="font-size: 0.85rem; color: var(--color-text-body); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Or continue with</span>
        <hr style="flex-grow: 1; border: none; border-top: 1px solid var(--color-border); margin-left: 1rem;">
      </div>

      <div class="auth-social" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
        <button type="button" class="btn" style="background: transparent; border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--color-text); padding: 0.75rem; border-radius: 0.5rem; cursor: pointer; transition: background-color 0.2s;">
          <i class="bi bi-google" style="color: #ea4335;"></i> <span style="font-weight: 600;">Google</span>
        </button>
        <button type="button" class="btn" style="background: transparent; border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--color-text); padding: 0.75rem; border-radius: 0.5rem; cursor: pointer; transition: background-color 0.2s;">
          <i class="bi bi-apple"></i> <span style="font-weight: 600;">Apple</span>
        </button>
      </div>

      <div class="auth-footer">
        Don't have a patient account yet? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
