<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F7F6" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19A7A0" />
      <stop offset="100%" stop-color="#20C9C0" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12304A" />
      <stop offset="100%" stop-color="#1A4265" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)" stroke="#EDF2F7" stroke-width="2"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#20C9C0" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Calendar Body -->
  <rect x="60" y="65" width="80" height="75" rx="8" fill="#FFFFFF" stroke="url(#navyGrad)" stroke-width="4"/>
  <path d="M 60 90 L 140 90" stroke="url(#navyGrad)" stroke-width="4"/>
  <!-- Calendar Header Red/Teal bar -->
  <path d="M 62 67 L 138 67 C 140 67, 140 90, 138 90 L 62 90 C 60 90, 60 67, 62 67 Z" fill="url(#tealGrad)"/>
  <!-- Calendar rings -->
  <rect x="75" y="55" width="8" height="18" rx="4" fill="url(#navyGrad)"/>
  <rect x="117" y="55" width="8" height="18" rx="4" fill="url(#navyGrad)"/>
  
  <!-- Date grid points -->
  <circle cx="80" cy="105" r="4" fill="#CBD5E1"/>
  <circle cx="100" cy="105" r="4" fill="#CBD5E1"/>
  <circle cx="120" cy="105" r="4" fill="#CBD5E1"/>
  
  <circle cx="80" cy="122" r="4" fill="#CBD5E1"/>
  <circle cx="100" cy="122" r="4" fill="url(#tealGrad)"/>
  <circle cx="120" cy="122" r="4" fill="#CBD5E1"/>
  
  <!-- Checkmark on selected date -->
  <path d="M 94 122 L 98 126 L 106 116" fill="none" stroke="#12304A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Hand Click/Cursor icon -->
  <path d="M 120 120 L 135 150 L 125 155 L 115 135 Z" fill="url(#navyGrad)" opacity="0.95"/>
  <circle cx="120" cy="120" r="3" fill="#FFFFFF"/>
</svg>
