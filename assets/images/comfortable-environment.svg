<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F7F6" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19A7A0" />
      <stop offset="100%" stop-color="#20C9C0" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12304A" />
      <stop offset="100%" stop-color="#1A4265" />
    </linearGradient>
  </defs>
  <!-- Background Circle with Soft Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)" stroke="#EDF2F7" stroke-width="2"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#20C9C0" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Lounge Chair / Clinic Chair (Stylized Modern 3D/Flat) -->
  <!-- Chair Base -->
  <rect x="70" y="135" width="60" height="8" rx="4" fill="url(#navyGrad)"/>
  <rect x="95" y="115" width="10" height="25" fill="url(#navyGrad)"/>
  <!-- Chair Seat -->
  <path d="M 60 115 C 80 115, 110 110, 140 100 C 150 95, 155 105, 145 112 C 120 125, 95 125, 65 122 C 58 120, 58 115, 60 115 Z" fill="url(#tealGrad)"/>
  <!-- Chair Backrest -->
  <path d="M 62 118 C 50 110, 42 90, 48 70 C 50 62, 60 65, 58 75 C 55 90, 60 105, 66 115" fill="none" stroke="url(#tealGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Pillow / Headrest -->
  <rect x="42" y="60" width="16" height="10" rx="5" fill="url(#navyGrad)"/>
  
  <!-- Soft Ambient Sparks/Aroma lines -->
  <path d="M 125 55 Q 130 45, 125 35" fill="none" stroke="#19A7A0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 135 60 Q 140 50, 135 40" fill="none" stroke="#19A7A0" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Glowing Sun / Warm Light -->
  <circle cx="150" cy="50" r="12" fill="#FFE082" opacity="0.8"/>
  <circle cx="150" cy="50" r="18" fill="none" stroke="#FFE082" stroke-width="1" stroke-dasharray="2 2"/>
</svg>
